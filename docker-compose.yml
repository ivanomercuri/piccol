services:
  db:
    image: postgres:16
    container_name: postgres-db
    environment:
      # Interpolati da Compose leggendo .env alla radice del repo: stessi
      # valori usati da backend/config/config.js per connettersi qui via
      # Sequelize, invece di due copie indipendenti della stessa password.
      # Nota sul nome DB_ROOT_PASSWORD: in PostgreSQL non esiste un utente
      # "root" come in MySQL, ma il concetto di superuser del container è lo
      # stesso — il nome della variabile è stato mantenuto invariato nella
      # migrazione MySQL -> PostgreSQL per non spezzare .env già esistenti.
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is missing in .env}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is missing in .env}
      # Superuser del container. Su MySQL era implicito ("root"), su
      # PostgreSQL va indicato esplicitamente perché è anche il nome del
      # ruolo con cui Sequelize si connette (vedi config/config.js).
      POSTGRES_USER: ${DB_USER:?DB_USER is missing in .env}
    ports:
      # Solo il lato host (sinistra) è configurabile: 5432 dentro al
      # container è intrinseco all'immagine postgres, cambiarlo richiederebbe
      # riconfigurare il server PostgreSQL stesso, non solo questa mappatura.
      - "${DB_HOST_PORT:?DB_HOST_PORT is missing in .env}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready è l'equivalente PostgreSQL di "mysqladmin ping": esce con
      # 0 solo quando il server accetta davvero connessioni, non appena il
      # processo è partito — è ciò che rende affidabile il
      # "condition: service_healthy" dei servizi che dipendono da db.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER is missing in .env} -d ${DB_NAME:?DB_NAME is missing in .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  adminer:
    # Sostituisce phpMyAdmin, che supporta solo MySQL/MariaDB. Adminer è un
    # singolo binario PHP (~10MB contro i ~500MB di pgAdmin), senza setup di
    # login o registrazione manuale del server: sovradimensionare qui non
    # aggiungeva nulla per uno schema di 6 tabelle.
    image: adminer:5
    container_name: adminer
    restart: unless-stopped
    environment:
      # Pre-compila l'host nel form di login, così non va digitato "db" a mano
      # ad ogni accesso.
      - ADMINER_DEFAULT_SERVER=db
    ports:
      # A differenza di phpMyAdmin (nginx sulla 80), l'immagine ufficiale di
      # Adminer serve il proprio PHP built-in server sulla 8080.
      - "${ADMINER_HOST_PORT:?ADMINER_HOST_PORT is missing in .env}:8080"
    healthcheck:
      # L'immagine Adminer è basata su Alpine e non include curl: usiamo il
      # wget di BusyBox, che c'è sempre.
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8080/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
  backend:
    build: ./backend
    # Nome dell'immagine esplicito e CONDIVISO con test_backend (vedi lì).
    image: piccol-backend
    container_name: express-backend
    user: "1000:1000"
    ports:
      # Lato host (sinistra) e porta interna dell'app (destra) configurabili
      # separatamente: BACKEND_HOST_PORT è "a quale porta ci arrivi tu dalla
      # tua macchina", PORT è "su quale porta ascolta l'app dentro il
      # container" (letta da main.ts tramite ConfigService) — due concetti distinti che
      # possono cambiare indipendentemente.
      - "${BACKEND_HOST_PORT:?BACKEND_HOST_PORT is missing in .env}:${PORT:?PORT is missing in .env}"
      - "${BACKEND_DEBUG_PORT:?BACKEND_DEBUG_PORT is missing in .env}:9229"
    volumes:
      - ./backend:/app
      # Volume NOMINATO, non anonimo (vedi la nota sul volume in fondo al
      # file): serve a impedire che il bind-mount di ./backend sovrascriva
      # /app/node_modules con quello dell'host, che è installato per l'host e
      # non per l'immagine Alpine.
      - backend-node-modules:/app/node_modules
    env_file:
      # Inietta le variabili di .env (PORT, JWT_SECRET, ecc.) direttamente
      # nell'ambiente del container: l'app Node le trova già in
      # process.env all'avvio, senza dipendere dal fatto che backend/ (unico
      # percorso montato nel container) contenga anche .env.
      - ./.env
    environment:
      # Legato al nome del servizio "db" nella rete Docker interna, non a
      # una scelta di configurazione: resta letterale, come
      # ADMINER_DEFAULT_SERVER sopra, e per lo stesso motivo non sta in .env.
      # È però obbligatoria: config/databaseUrl.ts si rifiuta di comporre
      # l'URL del database se manca. Va quindi ripetuta su ogni servizio che
      # esegue codice dell'app — vedi test_backend più sotto, che non l'ha
      # avuta dalla migrazione a Prisma fino alla fase F0 di quella a NestJS.
      #
      # Qui non ci sono credenziali del database: arrivano da env_file, che
      # legge lo stesso .env. Ripeterle sarebbe una seconda copia degli stessi
      # valori.
      - DB_HOST=db
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${PORT:?PORT is missing in .env}/" ]
    depends_on:
      db:
        condition: service_healthy
  test_backend:
    build: ./backend
    # Stessa immagine del servizio backend, non una propria.
    #
    # Senza `image:`, Compose costruisce e nomina un'immagine diversa per ogni
    # servizio che ha `build:` — qui `piccol-test_backend` — e la ricostruisce
    # solo se glielo si chiede per quel servizio. Quell'immagine era rimasta
    # ferma a 9 mesi prima (Node 20.19, dipendenze precedenti a Prisma), mentre
    # `backend` veniva ricostruito. Il volume node_modules condiviso nascondeva
    # il problema a metà: si inizializza dall'immagine del PRIMO container che
    # lo crea, quindi la suite funzionava o no a seconda di quale servizio
    # partiva per primo dopo un reset del volume. Con un solo nome d'immagine
    # i due servizi girano per costruzione sullo stesso Node e sulle stesse
    # dipendenze.
    image: piccol-backend
    container_name: backend-test
    volumes:
      - ./backend:/app
      # Lo STESSO volume del servizio backend, non uno per conto proprio: i
      # due servizi girano dalla stessa immagine con le stesse dipendenze,
      # quindi averne due copie significa solo avere due cose che possono
      # divergere. A runtime nessuno dei due scrive in node_modules (npm ci
      # gira nel Dockerfile), quindi la condivisione è sicura.
      - backend-node-modules:/app/node_modules
    env_file:
      - ./.env
    environment:
      # Va ripetuto qui e non solo sul servizio `backend`: DB_HOST non sta in
      # .env (è il nome del servizio nella rete Docker, non una scelta di
      # configurazione), quindi env_file non lo porta. Senza questa riga
      # config/databaseUrl.ts si rifiuta di comporre l'URL e il `pretest`
      # muore su "Missing environment variables required to build the
      # database URL: DB_HOST" — motivo per cui questo servizio era rotto
      # dalla migrazione a Prisma, indipendentemente dal volume stantio.
      - DB_HOST=db
    command: [ "npm", "run", "test" ]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    container_name: react-frontend
    ports:
      - "${FRONTEND_HOST_PORT:?FRONTEND_HOST_PORT is missing in .env}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_HOST=0.0.0.0
    command: [ "npm", "run", "dev" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/" ]
    depends_on:
      - backend
volumes:
  # node_modules del backend, condiviso fra i servizi `backend` e
  # `test_backend`.
  #
  # PERCHÉ NOMINATO E NON ANONIMO. Prima era un volume anonimo
  # (`- /app/node_modules`). Docker Compose però **riusa** il volume anonimo
  # associato a un servizio invece di ricrearlo dall'immagine a ogni avvio,
  # quindi quel volume si era fossilizzato: conteneva ancora i binari
  # `sequelize` e `sequelize-cli`, cioè risaliva a prima della migrazione a
  # Prisma, e non conteneva `prisma`. Effetto pratico:
  # `docker compose run --rm test_backend` falliva con `sh: prisma: not
  # found`, e un volume anonimo non ha un nome con cui individuarlo o
  # rimuoverlo.
  #
  # Con un volume nominato il problema resta possibile, ma diventa visibile e
  # governabile: `docker volume ls` lo mostra e si azzera deliberatamente.
  #
  # DOPO OGNI MODIFICA ALLE DIPENDENZE (package.json) va ricostruita
  # l'immagine E rimosso questo volume, altrimenti i container continuano a
  # usare i pacchetti vecchi:
  #
  #   docker compose down
  #   docker volume rm piccol_backend-node-modules
  #   docker compose build backend
  #   docker compose up -d
  backend-node-modules:
  # Rinominato da mysql-data nella migrazione a PostgreSQL: è un volume
  # diverso, con un layout su disco incompatibile con quello di MySQL — il
  # vecchio mysql-data resta sul sistema finché non lo si rimuove a mano
  # (`docker volume rm piccol_mysql-data`), utile se serve ancora consultare
  # i dati del vecchio database.
  postgres-data:
