services:
  db:
    image: postgres:16
    container_name: postgres-db
    environment:
      # Interpolati da Compose leggendo .env alla radice del repo: stessi
      # valori usati da backend/config/config.js per connettersi qui via
      # Sequelize, invece di due copie indipendenti della stessa password.
      # Nota sul nome DB_ROOT_PASSWORD: in PostgreSQL non esiste un utente
      # "root" come in MySQL, ma il concetto di superuser del container è lo
      # stesso — il nome della variabile è stato mantenuto invariato nella
      # migrazione MySQL -> PostgreSQL per non spezzare .env già esistenti.
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is missing in .env}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is missing in .env}
      # Superuser del container. Su MySQL era implicito ("root"), su
      # PostgreSQL va indicato esplicitamente perché è anche il nome del
      # ruolo con cui Sequelize si connette (vedi config/config.js).
      POSTGRES_USER: ${DB_USER:?DB_USER is missing in .env}
    ports:
      # Solo il lato host (sinistra) è configurabile: 5432 dentro al
      # container è intrinseco all'immagine postgres, cambiarlo richiederebbe
      # riconfigurare il server PostgreSQL stesso, non solo questa mappatura.
      - "${DB_HOST_PORT:?DB_HOST_PORT is missing in .env}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready è l'equivalente PostgreSQL di "mysqladmin ping": esce con
      # 0 solo quando il server accetta davvero connessioni, non appena il
      # processo è partito — è ciò che rende affidabile il
      # "condition: service_healthy" dei servizi che dipendono da db.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER is missing in .env} -d ${DB_NAME:?DB_NAME is missing in .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  adminer:
    # Sostituisce phpMyAdmin, che supporta solo MySQL/MariaDB. Adminer è un
    # singolo binario PHP (~10MB contro i ~500MB di pgAdmin), senza setup di
    # login o registrazione manuale del server: sovradimensionare qui non
    # aggiungeva nulla per uno schema di 6 tabelle.
    image: adminer:5
    container_name: adminer
    restart: unless-stopped
    environment:
      # Pre-compila l'host nel form di login, così non va digitato "db" a mano
      # ad ogni accesso.
      - ADMINER_DEFAULT_SERVER=db
    ports:
      # A differenza di phpMyAdmin (nginx sulla 80), l'immagine ufficiale di
      # Adminer serve il proprio PHP built-in server sulla 8080.
      - "${ADMINER_HOST_PORT:?ADMINER_HOST_PORT is missing in .env}:8080"
    healthcheck:
      # L'immagine Adminer è basata su Alpine e non include curl: usiamo il
      # wget di BusyBox, che c'è sempre.
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8080/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
  backend:
    build: ./backend
    container_name: express-backend
    user: "1000:1000"
    ports:
      # Lato host (sinistra) e porta interna dell'app (destra) configurabili
      # separatamente: BACKEND_HOST_PORT è "a quale porta ci arrivi tu dalla
      # tua macchina", PORT è "su quale porta ascolta l'app dentro il
      # container" (già letta da server.ts) — due concetti distinti che
      # possono cambiare indipendentemente.
      - "${BACKEND_HOST_PORT:?BACKEND_HOST_PORT is missing in .env}:${PORT:?PORT is missing in .env}"
      - "${BACKEND_DEBUG_PORT:?BACKEND_DEBUG_PORT is missing in .env}:9229"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      # Inietta le variabili di .env (PORT, JWT_SECRET, ecc.) direttamente
      # nell'ambiente del container: l'app Node le trova già in
      # process.env all'avvio, senza dipendere dal fatto che backend/ (unico
      # percorso montato nel container) contenga anche .env.
      - ./.env
    environment:
      # Legato al nome del servizio "db" nella rete Docker interna, non a
      # una scelta di configurazione: resta letterale, come ADMINER_DEFAULT_SERVER
      # sopra. DB_PASSWORD/DB_NAME sono state rimosse da
      # qui: erano una terza copia delle credenziali, usata solo dallo stub
      # non montato controllers/exampleController.ts, mai da un percorso
      # applicativo reale (Sequelize legge invece da config/config.js). Se
      # in futuro exampleController.ts viene davvero collegato a una route,
      # le sue variabili andranno ripensate insieme a quel lavoro, non
      # duplicate qui "per sicurezza".
      - DB_HOST=db
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${PORT:?PORT is missing in .env}/" ]
    depends_on:
      db:
        condition: service_healthy
  test_backend:
    build: ./backend
    container_name: backend-test
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./.env
    command: [ "npm", "run", "test" ]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    container_name: react-frontend
    ports:
      - "${FRONTEND_HOST_PORT:?FRONTEND_HOST_PORT is missing in .env}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_HOST=0.0.0.0
    command: [ "npm", "run", "dev" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/" ]
    depends_on:
      - backend
volumes:
  # Rinominato da mysql-data nella migrazione a PostgreSQL: è un volume
  # diverso, con un layout su disco incompatibile con quello di MySQL — il
  # vecchio mysql-data resta sul sistema finché non lo si rimuove a mano
  # (`docker volume rm piccol_mysql-data`), utile se serve ancora consultare
  # i dati del vecchio database.
  postgres-data:
